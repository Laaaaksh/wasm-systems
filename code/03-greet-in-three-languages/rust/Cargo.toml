[package]
name = "greet-cli-rust"
version = "0.1.0"
edition = "2021"

[package.metadata.component]
package = "wasm-systems:greet-cli-rust"

[package.metadata.component.target]
world = "greet-cli"
path = "../wit"

[package.metadata.component.target.dependencies]
"wasi:cli" = { path = "../wit/deps/wasi-cli-0.2.3" }
"wasi:io" = { path = "../wit/deps/wasi-io-0.2.3" }
"wasi:clocks" = { path = "../wit/deps/wasi-clocks-0.2.3" }
"wasi:filesystem" = { path = "../wit/deps/wasi-filesystem-0.2.3" }
"wasi:random" = { path = "../wit/deps/wasi-random-0.2.3" }
"wasi:sockets" = { path = "../wit/deps/wasi-sockets-0.2.3" }

[dependencies]
wit-bindgen-rt = { version = "0.44.0", features = ["bitflags"] }
